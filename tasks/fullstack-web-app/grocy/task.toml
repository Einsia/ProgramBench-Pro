schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/grocy"
version = "1.0.0"
description = "Reconstruct Grocy 4.7.1, a household grocery and inventory management application, from black-box observation."
keywords = ["household-inventory", "groceries", "stock-management", "web", "php", "sqlite"]

[metadata]
category = "fullstack-web-app"
upstream = "grocy/grocy 4.7.1"
license = "MIT"
interface = "browser GUI; HTTP API; iCalendar and data-file uploads and downloads"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-grocy-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 60

[verifier]
timeout_sec = 155400
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-grocy-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
