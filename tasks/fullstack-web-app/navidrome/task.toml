schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/navidrome"
version = "1.0.0"
description = "Reconstruct Navidrome 0.64.2, a self-hosted music library and streaming server, from black-box observation."
keywords = ["music-library", "audio-streaming", "opensubsonic", "browser", "go", "react"]

[metadata]
category = "fullstack-web-app"
upstream = "navidrome/navidrome 0.64.2"
license = "GPL-3.0-only"
interface = "browser GUI; OpenSubsonic and native HTTP APIs; music-library file operations; product uploads and downloads"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-navidrome-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 60

[verifier]
timeout_sec = 94800
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-navidrome-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
