services:
  main:
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    volumes:
      - "${KOMGA_VERIFIER_STATE:-candidate-state}:/app/candidate-state"
      - "${KOMGA_VERIFIER_TMP:-verifier-tmp}:/tmp"
      - "${KOMGA_MODEL_RPC_STORAGE:-model-rpc}:/model"
      - "${KOMGA_VERIFIER_EXCHANGE:-verifier-exchange}:/exchange"
volumes:
  candidate-state:
  verifier-tmp:
  model-rpc:
  verifier-exchange:
