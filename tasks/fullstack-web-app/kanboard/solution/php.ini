; The official Docker image's PHP settings (docker/etc/php85/conf.d/local.ini), for the built-in web server.
; There PHP-FPM writes displayed errors to its stderr, never into a response; with the built-in web server the same
; result needs display_errors off and the errors logged to stderr.
expose_php = Off
error_reporting = E_ALL
display_errors = Off
log_errors = 1
error_log = /dev/stderr
date.timezone = UTC
allow_url_fopen = 1
post_max_size = 32M
upload_max_filesize = 32M
opcache.enable = 1
opcache.enable_cli = 1
opcache.save_comments = 0
opcache.enable_file_override = 1
session.gc_divisor = 100
session.gc_probability = 15
