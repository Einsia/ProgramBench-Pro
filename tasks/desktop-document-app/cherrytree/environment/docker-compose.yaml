services:
  main:
    image: program-bench-cherrytree-agent:1.0.0
    pull_policy: never
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - "${CHERRYTREE_RPC_STORAGE:-blackbox-rpc}:/blackbox:ro"
      - "${CHERRYTREE_AGENT_TMP:-agent-tmp}:/tmp"
  blackbox:
    image: program-bench-cherrytree-reference:1.0.0
    pull_policy: never
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 8g
    pids_limit: 2048
    shm_size: 256m
    volumes:
      - "${CHERRYTREE_RPC_STORAGE:-blackbox-rpc}:/blackbox"
      - "${CHERRYTREE_REFERENCE_STORAGE:-reference-state}:/reference"
      - "${CHERRYTREE_REFERENCE_TMP:-reference-tmp}:/tmp"
volumes:
  blackbox-rpc:
  agent-tmp:
  reference-state:
  reference-tmp:
