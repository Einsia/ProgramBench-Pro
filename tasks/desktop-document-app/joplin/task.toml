schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/joplin"
version = "1.0.0"
description = "Reconstruct Joplin 3.7.21, a notebook application with Markdown editing and a local document API, from black-box observation."
keywords = ["notes", "markdown", "desktop", "electron", "document-api"]

[metadata]
category = "desktop-document-app"
upstream = "laurent22/joplin 3.7.21"
license = "AGPL-3.0-or-later"
interface = "Electron/React desktop GUI; local Data API; document exchange; clipboard"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-joplin-agent:1.0.0"
build_timeout_sec = 1200
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 120

[verifier]
timeout_sec = 187800
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-joplin-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 1200
