schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/moneymanagerex"
version = "1.0.0"
description = "Reconstruct Money Manager Ex 1.9.4, a personal finance desktop application for accounts, budgets and transactions, from black-box observation."
keywords = ["personal-finance", "desktop", "wxwidgets", "sqlite"]

[metadata]
category = "desktop-document-app"
upstream = "moneymanagerex/moneymanagerex 1.9.4"
license = "GPL-2.0-or-later"
interface = "desktop GUI (wxWidgets on GTK); document exchange and clipboard text"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-moneymanagerex-agent:1.0.0"
build_timeout_sec = 1200
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 120

[verifier]
timeout_sec = 202800
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-moneymanagerex-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 1200
