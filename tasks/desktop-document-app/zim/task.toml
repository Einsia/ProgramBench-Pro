schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/zim"
version = "1.0.0"
description = "Reconstruct Zim 0.77.2, a desktop wiki that stores linked notebook pages as plain text, from black-box observation."
keywords = ["wiki", "notebook", "desktop", "gtk"]

[metadata]
category = "desktop-document-app"
upstream = "zim-desktop-wiki/zim-desktop-wiki 0.77.2"
license = "GPL-2.0-or-later"
interface = "desktop GUI (GTK); command line; notebook/document exchange and clipboard text"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-zim-agent:1.0.0"
build_timeout_sec = 1200
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 120

[verifier]
timeout_sec = 91200
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-zim-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 1200
