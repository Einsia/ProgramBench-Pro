schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/gnumeric"
version = "1.0.0"
description = "Reconstruct Gnumeric 1.12.62, a native spreadsheet application for calculations and tabular data, from black-box observation."
keywords = ["spreadsheet", "formulas", "data-analysis", "desktop", "gtk"]

[metadata]
category = "desktop-document-app"
upstream = "GNOME/gnumeric 1.12.62"
license = "GPL-2.0-only OR GPL-3.0-only"
interface = "GTK desktop GUI; document exchange; clipboard; ssconvert/ssindex/ssgrep/ssdiff command-line tools"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-gnumeric-agent:1.0.0"
build_timeout_sec = 1200
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 120

[verifier]
timeout_sec = 355200
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-gnumeric-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 1200
