schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/zotero"
version = "1.0.0"
description = "Reconstruct Zotero 10.0.6, a research reference manager with citation tools and a local Web API, from black-box observation."
keywords = ["reference-management", "bibliography", "desktop", "gecko", "local-api"]

[metadata]
category = "desktop-document-app"
upstream = "zotero/zotero 10.0.6"
license = "AGPL-3.0-or-later"
interface = "desktop GUI (Gecko/XUL); local Web API; document exchange and clipboard text/HTML/images"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-zotero-agent:1.0.0"
build_timeout_sec = 1800
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 180

[verifier]
timeout_sec = 220800
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-zotero-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 1800
