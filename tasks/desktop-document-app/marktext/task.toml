schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/marktext"
version = "1.0.0"
description = "Reconstruct MarkText 0.23.0, a visual Markdown editor for writing and exporting documents, from black-box observation."
keywords = ["markdown", "wysiwyg", "editor", "desktop", "electron"]

[metadata]
category = "desktop-document-app"
upstream = "marktext/marktext 0.23.0"
license = "MIT"
interface = "Electron desktop GUI; document-opening command-line arguments; document exchange; clipboard"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-marktext-agent:1.0.0"
build_timeout_sec = 1800
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 120

[verifier]
timeout_sec = 86400
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-marktext-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 1800
