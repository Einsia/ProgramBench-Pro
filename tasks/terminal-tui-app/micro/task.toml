schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/micro"
version = "1.0.0"
description = "Reconstruct micro 2.0.15, a terminal text editor with configurable editing commands, from black-box observation."
keywords = ["text-editor", "terminal", "go", "syntax-highlighting", "pty"]

[metadata]
category = "terminal-tui-app"
upstream = "micro-editor/micro 2.0.15"
license = "MIT AND Apache-2.0 AND BSD-3-Clause AND BSD-2-Clause AND MPL-2.0"
interface = "terminal UI (PTY); command line; workspace and configuration files"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-micro-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 60

[verifier]
timeout_sec = 319800
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-micro-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
