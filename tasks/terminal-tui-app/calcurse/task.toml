schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/calcurse"
version = "1.0.0"
description = "Reconstruct calcurse 4.8.2, a terminal calendar and to-do organizer with iCalendar import and export, from black-box observation."
keywords = ["calendar", "todo", "terminal", "curses", "icalendar"]

[metadata]
category = "terminal-tui-app"
upstream = "lfos/calcurse 4.8.2"
license = "BSD-2-Clause"
interface = "terminal UI (PTY); command line; home-directory file exchange; user documentation"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-calcurse-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 60

[verifier]
timeout_sec = 195000
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-calcurse-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
