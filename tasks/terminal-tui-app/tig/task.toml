schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/tig"
version = "1.0.0"
description = "Reconstruct Tig 2.6.1, a terminal browser for Git history and working-tree changes, from black-box observation."
keywords = ["git", "history-browser", "terminal", "ncurses", "version-control"]

[metadata]
category = "terminal-tui-app"
upstream = "jonas/tig 2.6.1"
license = "GPL-2.0-or-later"
interface = "terminal UI (PTY); native console and grep; command line and pager; Git repository and file inspection"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-tig-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 60

[verifier]
timeout_sec = 459000
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-tig-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
