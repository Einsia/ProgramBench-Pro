schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/visidata"
version = "1.0.0"
description = "Reconstruct VisiData 3.4, a terminal tool for exploring and editing tabular data, from black-box observation."
keywords = ["tabular-data", "spreadsheet", "csv", "terminal", "python", "curses"]

[metadata]
category = "terminal-tui-app"
upstream = "saulpw/visidata 3.4"
license = "GPL-3.0-only"
interface = "terminal UI (PTY); batch command line; workspace files and input history"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-visidata-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 60

[verifier]
timeout_sec = 280200
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-visidata-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
