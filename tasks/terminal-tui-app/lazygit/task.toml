schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/lazygit"
version = "1.0.0"
description = "Reconstruct lazygit 0.66.2, a terminal Git client for staging changes and managing repository history, from black-box observation."
keywords = ["git", "version-control", "terminal", "repository"]

[metadata]
category = "terminal-tui-app"
upstream = "jesseduffield/lazygit 0.66.2"
license = "MIT"
interface = "terminal UI (PTY); Git inspection and repository setup; workspace and state file access; command-line options; OSC 52 clipboard"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-lazygit-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 60

[verifier]
timeout_sec = 290400
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-lazygit-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
