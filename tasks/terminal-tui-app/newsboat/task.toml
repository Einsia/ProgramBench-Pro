schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/newsboat"
version = "1.0.0"
description = "Reconstruct Newsboat 2.45, a terminal reader for RSS and Atom feeds, from black-box observation."
keywords = ["rss", "atom", "feed-reader", "terminal", "stfl"]

[metadata]
category = "terminal-tui-app"
upstream = "newsboat/newsboat 2.45"
license = "MIT"
interface = "terminal UI (PTY); command line; home files; SQLite cache; local feed HTTP input"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-newsboat-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 60

[verifier]
timeout_sec = 285000
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-newsboat-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
