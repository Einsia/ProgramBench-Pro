schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/musescorestudio"
version = "1.0.0"
description = "Reconstruct MuseScore Studio 4.7.6, a music notation editor for composing and engraving scores, from black-box observation."
keywords = ["music-notation", "score-editor", "desktop", "qt-quick", "musicxml"]

[metadata]
category = "desktop-media-app"
upstream = "musescore/MuseScore 4.7.6"
license = "GPL-3.0-only"
interface = "Qt Quick desktop GUI; score-conversion command line; score/document exchange"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-musescorestudio-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 15
retries = 120

[verifier]
timeout_sec = 86400
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-musescorestudio-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
