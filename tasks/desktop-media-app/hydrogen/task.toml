schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/hydrogen"
version = "1.0.0"
description = "Reconstruct Hydrogen 1.2.7, a drum machine for creating patterns, arranging songs and exporting percussion audio, from black-box observation."
keywords = ["drum-machine", "sequencer", "audio", "desktop", "qt", "osc"]

[metadata]
category = "desktop-media-app"
upstream = "hydrogen-music/hydrogen 1.2.7"
license = "GPL-2.0-or-later"
interface = "desktop GUI (Qt); OSC over UDP; command line (h2cli); document exchange and settings"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-hydrogen-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 15
retries = 120

[verifier]
timeout_sec = 111000
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-hydrogen-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
