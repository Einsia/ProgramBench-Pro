schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/lmms"
version = "1.0.0"
description = "Reconstruct LMMS 1.2.2, a digital audio workstation for composing, synthesizing and rendering music, from black-box observation."
keywords = ["music-production", "sequencer", "synthesizer", "audio", "desktop", "qt"]

[metadata]
category = "desktop-media-app"
upstream = "LMMS/lmms 1.2.2"
license = "GPL-2.0-or-later"
interface = "desktop GUI (Qt); command-line render/rendertracks/dump/upgrade; document exchange and settings"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-lmms-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 15
retries = 120

[verifier]
timeout_sec = 98400
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-lmms-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
