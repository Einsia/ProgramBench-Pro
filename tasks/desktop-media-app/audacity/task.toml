schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/audacity"
version = "1.0.0"
description = "Reconstruct Audacity 2.4.2, an audio editor for recording, processing and arranging sound, from black-box observation."
keywords = ["audio-editing", "desktop", "wxwidgets", "scripting", "waveforms"]

[metadata]
category = "desktop-media-app"
upstream = "audacity/audacity 2.4.2"
license = "GPL-2.0-or-later"
interface = "desktop GUI (wxWidgets); scripting pipe; audio/label/project document exchange"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-audacity-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 15
retries = 120

[verifier]
timeout_sec = 109200
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-audacity-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
