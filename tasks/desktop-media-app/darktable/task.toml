schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/darktable"
version = "1.0.0"
description = "Reconstruct darktable 5.6.2, a photography application for managing and developing digital images, from black-box observation."
keywords = ["photography", "raw-images", "desktop", "gtk", "image-processing"]

[metadata]
category = "desktop-media-app"
upstream = "darktable-org/darktable 5.6.2"
license = "GPL-3.0-or-later"
interface = "desktop GUI (GTK 3); darktable-cli; document exchange and XMP sidecars"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-darktable-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 15
retries = 120

[verifier]
timeout_sec = 190800
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-darktable-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
