schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/strawberry"
version = "1.0.0"
description = "Reconstruct Strawberry 1.2.31, a music player for organizing collections and managing playlists, from black-box observation."
keywords = ["audio-player", "music-collection", "playlists", "desktop", "qt", "mpris"]

[metadata]
category = "desktop-media-app"
upstream = "strawberrymusicplayer/strawberry 1.2.31"
license = "GPL-3.0-or-later"
interface = "Qt 6 desktop GUI; MPRIS2; command line; media/playlist exchange"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-strawberry-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 15
retries = 120

[verifier]
timeout_sec = 145800
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-strawberry-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
