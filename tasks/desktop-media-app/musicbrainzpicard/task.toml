schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/musicbrainzpicard"
version = "1.0.0"
description = "Reconstruct MusicBrainz Picard 3.0.3, an audio metadata tagger with file organization and scripting tools, from black-box observation."
keywords = ["music-tagging", "audio-metadata", "desktop", "qt-widgets", "file-organization"]

[metadata]
category = "desktop-media-app"
upstream = "metabrainz/picard 3.0.3"
license = "GPL-2.0-or-later"
interface = "Qt Widgets desktop GUI; remote commands; picard-cli; media/profile/session exchange"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-musicbrainzpicard-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 15
retries = 120

[verifier]
timeout_sec = 101400
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-musicbrainzpicard-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
