schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/drawdb"
version = "1.0.0"
description = "Reconstruct drawDB 1.8.2, a browser editor for database diagrams and SQL schemas, from black-box observation."
keywords = ["database", "schema", "sql", "diagram", "browser", "react"]

[metadata]
category = "browser-frontend-app"
upstream = "drawdb-io/drawdb 1.8.2"
license = "AGPL-3.0-only AND MIT AND Apache-2.0 AND ISC AND BSD-3-Clause AND Zlib AND MPL-2.0 AND Unlicense AND 0BSD"
interface = "browser GUI; file upload, drop and download; clipboard read and write; lifecycle controls"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-drawdb-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 60

[verifier]
timeout_sec = 239400
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-drawdb-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
