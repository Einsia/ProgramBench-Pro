schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/jsoneditor"
version = "1.0.0"
description = "Reconstruct JSON Editor 10.4.3, a browser component for editing and validating JSON trees and text, from black-box observation."
keywords = ["json", "tree-editor", "browser", "javascript", "schema-validation"]

[metadata]
category = "browser-frontend-app"
upstream = "josdejong/jsoneditor 10.4.3"
license = "Apache-2.0 AND MIT AND ISC AND BSD-3-Clause AND BSD-2-Clause"
interface = "browser GUI; documented JavaScript API; file upload/drop and JSON downloads"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-jsoneditor-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 60

[verifier]
timeout_sec = 238200
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-jsoneditor-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
