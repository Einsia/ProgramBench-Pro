schema_version = "1.4"
artifacts = [{ source = "/app/solution" }]

[task]
name = "program-bench/ittools"
version = "1.0.0"
description = "Reconstruct IT-Tools 2024.10.22-7ca5933, a browser collection of utilities for developers, from black-box observation."
keywords = ["developer-tools", "converters", "formatters", "cryptography", "browser", "vue"]

[metadata]
category = "browser-frontend-app"
upstream = "CorentinTh/it-tools 2024.10.22-7ca5933"
license = "GPL-3.0-only"
interface = "browser GUI; file upload, drop and download; clipboard; page clock; lifecycle controls"
network_boundary = "agent: no network except hosts allowed with --allow-agent-host (Harbor egress sidecar); reference and verifier: Compose network_mode:none; restricted Unix socket RPC to the black-box runtime"

[agent]
timeout_sec = 28800
user = "agent"

[environment]
docker_image = "program-bench-ittools-agent:1.0.0"
build_timeout_sec = 600
cpus = 4
memory_mb = 16384
storage_mb = 20480
network_mode = "no-network"

[environment.healthcheck]
command = "blackbox-health"
interval_sec = 1
timeout_sec = 5
retries = 60

[verifier]
timeout_sec = 175200
environment_mode = "separate"

[verifier.environment]
docker_image = "program-bench-ittools-verifier:1.0.0"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 600
